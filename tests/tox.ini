[tox]
envlist=flake8, py314

[testenv]
install_command=python -I -m pip install --no-index --find-links=/opt/node-agent-wheelhouse {opts} {packages}
deps=-rrequirements.lock
changedir={toxinidir}
commands=pytest tests -v --durations=20 {posargs}

[testenv:flake8]
deps=-rrequirements.lock
changedir={toxinidir}
commands=flake8 tests

[flake8]
ignore=E722,W503
