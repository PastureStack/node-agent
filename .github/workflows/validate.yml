name: Resolve Node Agent OpenTelemetry Go modules

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GOTOOLCHAIN: local
      GOTELEMETRY: 'off'
      GOWORK: 'off'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: node-agent
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: PastureStack/websocket-proxy
          ref: 67410de3c4c222b7fd76b85ddf42a022cd8c09b5
          path: websocket-proxy
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: 1.27.4
          check-latest: false
          cache: false
      - name: Generate and validate the vendored dependency update
        shell: bash
        working-directory: node-agent
        run: |
          set -euo pipefail
          mkdir -p ../evidence
          go get go.opentelemetry.io/otel@v1.47.0 \
            go.opentelemetry.io/otel/metric@v1.47.0 \
            go.opentelemetry.io/otel/trace@v1.47.0
          go mod tidy
          go mod vendor
          for target in linux windows; do
            GOOS="$target" GOARCH=amd64 go list -mod=vendor -deps \
              -f '{{with .Module}}{{.Path}} {{.Version}}{{end}}' . |
              sort -u | grep '^go.opentelemetry.io/' | tee "../evidence/active-otel-$target.txt"
            grep -Fx 'go.opentelemetry.io/otel/trace v1.47.0' "../evidence/active-otel-$target.txt"
          done
          git add -A -- go.mod go.sum vendor
          git diff --cached --check
          git diff --cached --binary --full-index -- go.mod go.sum vendor > ../evidence/otel147.patch
          git diff --cached --stat -- go.mod go.sum vendor > ../evidence/otel147.stat
          test -s ../evidence/otel147.patch
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: node-agent-otel147-vendor-patch
          path: evidence/
          if-no-files-found: error
          retention-days: 7
